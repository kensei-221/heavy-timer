<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Heavy Timer - サウンドプレビュー</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', sans-serif;
            background: #1a1a2e;
            color: white;
            padding: 20px;
            max-width: 800px;
            margin: 0 auto;
        }

        h1 {
            color: #00ff00;
            text-align: center;
        }

        h2 {
            color: #ffcc00;
            margin-top: 40px;
            border-bottom: 1px solid #333;
            padding-bottom: 10px;
        }

        .sound-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
            margin: 20px 0;
        }

        .sound-btn {
            background: linear-gradient(to bottom, #333, #222);
            border: 2px solid #444;
            color: white;
            padding: 20px;
            border-radius: 10px;
            cursor: pointer;
            font-size: 16px;
            transition: all 0.2s;
        }

        .sound-btn:hover {
            border-color: #00ff00;
            background: linear-gradient(to bottom, #444, #333);
        }

        .sound-btn:active {
            transform: scale(0.98);
        }

        .sound-btn .title {
            font-weight: bold;
            font-size: 18px;
            margin-bottom: 8px;
        }

        .sound-btn .desc {
            font-size: 12px;
            color: #888;
        }

        .instructions {
            background: #2a2a4a;
            padding: 15px;
            border-radius: 8px;
            margin: 20px 0;
        }
    </style>
</head>

<body>
    <h1>🔊 Heavy Timer サウンドプレビュー</h1>

    <div class="instructions">
        <p>各ボタンをクリックして音を確認してください。気に入ったサウンドの番号を教えてください！</p>
    </div>

    <h2>🥊 開始/終了ブザー音（Molten UX0020風）</h2>
    <div class="sound-grid" id="buzzer-sounds"></div>

    <h2>🪵 10秒前警告音（拍子木/クラッパー - 2連打）</h2>
    <div class="sound-grid" id="clapper-sounds"></div>

    <script>
        // AudioContextのシングルトン
        let audioContext = null;

        function getAudioContext() {
            if (!audioContext) {
                audioContext = new (window.AudioContext || window.webkitAudioContext)();
            }
            return audioContext;
        }

        // 歪みカーブ生成
        function createDistortionCurve(amount) {
            const samples = 44100;
            const curve = new Float32Array(samples);
            const deg = Math.PI / 180;
            for (let i = 0; i < samples; i++) {
                const x = (i * 2) / samples - 1;
                curve[i] = ((3 + amount) * x * 20 * deg) / (Math.PI + amount * Math.abs(x));
            }
            return curve;
        }

        // ========================================
        // 開始/終了ブザー音のバリエーション（10種類）
        // ========================================

        const buzzerVariations = [
            {
                name: "ブザー #1 - クラシック",
                desc: "低め重厚、強いFM変調",
                play: () => {
                    const ctx = getAudioContext();
                    const now = ctx.currentTime;

                    const carrier = ctx.createOscillator();
                    carrier.type = 'sawtooth';
                    carrier.frequency.value = 350;

                    const mod = ctx.createOscillator();
                    mod.type = 'square';
                    mod.frequency.value = 87.5;

                    const modGain = ctx.createGain();
                    modGain.gain.value = 150;

                    const mainGain = ctx.createGain();

                    mod.connect(modGain);
                    modGain.connect(carrier.frequency);
                    carrier.connect(mainGain);
                    mainGain.connect(ctx.destination);

                    mainGain.gain.setValueAtTime(0, now);
                    mainGain.gain.linearRampToValueAtTime(0.5, now + 0.01);
                    mainGain.gain.exponentialRampToValueAtTime(0.001, now + 0.8);

                    carrier.start(now);
                    mod.start(now);
                    carrier.stop(now + 0.8);
                    mod.stop(now + 0.8);
                }
            },
            {
                name: "ブザー #2 - 体育館風",
                desc: "より低音、残響長め",
                play: () => {
                    const ctx = getAudioContext();
                    const now = ctx.currentTime;

                    const carrier = ctx.createOscillator();
                    carrier.type = 'sawtooth';
                    carrier.frequency.value = 280;

                    const mod = ctx.createOscillator();
                    mod.type = 'sawtooth';
                    mod.frequency.value = 70;

                    const modGain = ctx.createGain();
                    modGain.gain.value = 180;

                    const mainGain = ctx.createGain();

                    mod.connect(modGain);
                    modGain.connect(carrier.frequency);
                    carrier.connect(mainGain);
                    mainGain.connect(ctx.destination);

                    mainGain.gain.setValueAtTime(0, now);
                    mainGain.gain.linearRampToValueAtTime(0.5, now + 0.015);
                    mainGain.gain.exponentialRampToValueAtTime(0.001, now + 1.2);

                    carrier.start(now);
                    mod.start(now);
                    carrier.stop(now + 1.2);
                    mod.stop(now + 1.2);
                }
            },
            {
                name: "ブザー #3 - シャープ",
                desc: "高めのピッチ、短い減衰",
                play: () => {
                    const ctx = getAudioContext();
                    const now = ctx.currentTime;

                    const carrier = ctx.createOscillator();
                    carrier.type = 'square';
                    carrier.frequency.value = 440;

                    const mod = ctx.createOscillator();
                    mod.type = 'square';
                    mod.frequency.value = 110;

                    const modGain = ctx.createGain();
                    modGain.gain.value = 100;

                    const mainGain = ctx.createGain();

                    mod.connect(modGain);
                    modGain.connect(carrier.frequency);
                    carrier.connect(mainGain);
                    mainGain.connect(ctx.destination);

                    mainGain.gain.setValueAtTime(0, now);
                    mainGain.gain.linearRampToValueAtTime(0.4, now + 0.005);
                    mainGain.gain.exponentialRampToValueAtTime(0.001, now + 0.5);

                    carrier.start(now);
                    mod.start(now);
                    carrier.stop(now + 0.5);
                    mod.stop(now + 0.5);
                }
            },
            {
                name: "ブザー #4 - ダブルトーン",
                desc: "2つの周波数を重ねたリッチな音",
                play: () => {
                    const ctx = getAudioContext();
                    const now = ctx.currentTime;

                    const carrier1 = ctx.createOscillator();
                    carrier1.type = 'sawtooth';
                    carrier1.frequency.value = 330;

                    const carrier2 = ctx.createOscillator();
                    carrier2.type = 'sawtooth';
                    carrier2.frequency.value = 350;

                    const mod = ctx.createOscillator();
                    mod.type = 'square';
                    mod.frequency.value = 82.5;

                    const modGain = ctx.createGain();
                    modGain.gain.value = 120;

                    const mainGain = ctx.createGain();

                    mod.connect(modGain);
                    modGain.connect(carrier1.frequency);
                    modGain.connect(carrier2.frequency);
                    carrier1.connect(mainGain);
                    carrier2.connect(mainGain);
                    mainGain.connect(ctx.destination);

                    mainGain.gain.setValueAtTime(0, now);
                    mainGain.gain.linearRampToValueAtTime(0.35, now + 0.01);
                    mainGain.gain.exponentialRampToValueAtTime(0.001, now + 0.9);

                    carrier1.start(now);
                    carrier2.start(now);
                    mod.start(now);
                    carrier1.stop(now + 0.9);
                    carrier2.stop(now + 0.9);
                    mod.stop(now + 0.9);
                }
            },
            {
                name: "ブザー #5 - ヘビーバズ",
                desc: "非常に強い変調、ビリビリ感",
                play: () => {
                    const ctx = getAudioContext();
                    const now = ctx.currentTime;

                    const carrier = ctx.createOscillator();
                    carrier.type = 'sawtooth';
                    carrier.frequency.value = 300;

                    const mod1 = ctx.createOscillator();
                    mod1.type = 'square';
                    mod1.frequency.value = 75;

                    const mod2 = ctx.createOscillator();
                    mod2.type = 'sawtooth';
                    mod2.frequency.value = 150;

                    const modGain1 = ctx.createGain();
                    modGain1.gain.value = 200;

                    const modGain2 = ctx.createGain();
                    modGain2.gain.value = 80;

                    const distortion = ctx.createWaveShaper();
                    distortion.curve = createDistortionCurve(50);

                    const mainGain = ctx.createGain();

                    mod1.connect(modGain1);
                    mod2.connect(modGain2);
                    modGain1.connect(carrier.frequency);
                    modGain2.connect(carrier.frequency);
                    carrier.connect(distortion);
                    distortion.connect(mainGain);
                    mainGain.connect(ctx.destination);

                    mainGain.gain.setValueAtTime(0, now);
                    mainGain.gain.linearRampToValueAtTime(0.4, now + 0.01);
                    mainGain.gain.exponentialRampToValueAtTime(0.001, now + 0.85);

                    carrier.start(now);
                    mod1.start(now);
                    mod2.start(now);
                    carrier.stop(now + 0.85);
                    mod1.stop(now + 0.85);
                    mod2.stop(now + 0.85);
                }
            },
            {
                name: "ブザー #6 - ゴング風",
                desc: "鐘のような余韻",
                play: () => {
                    const ctx = getAudioContext();
                    const now = ctx.currentTime;

                    const carrier = ctx.createOscillator();
                    carrier.type = 'sine';
                    carrier.frequency.value = 400;

                    const carrier2 = ctx.createOscillator();
                    carrier2.type = 'sawtooth';
                    carrier2.frequency.value = 398;

                    const mod = ctx.createOscillator();
                    mod.type = 'sine';
                    mod.frequency.value = 200;

                    const modGain = ctx.createGain();
                    modGain.gain.value = 100;

                    const mainGain = ctx.createGain();

                    mod.connect(modGain);
                    modGain.connect(carrier.frequency);
                    carrier.connect(mainGain);
                    carrier2.connect(mainGain);
                    mainGain.connect(ctx.destination);

                    mainGain.gain.setValueAtTime(0, now);
                    mainGain.gain.linearRampToValueAtTime(0.4, now + 0.005);
                    mainGain.gain.exponentialRampToValueAtTime(0.001, now + 1.5);

                    carrier.start(now);
                    carrier2.start(now);
                    mod.start(now);
                    carrier.stop(now + 1.5);
                    carrier2.stop(now + 1.5);
                    mod.stop(now + 1.5);
                }
            },
            {
                name: "ブザー #7 - インダストリアル",
                desc: "工場のサイレン風",
                play: () => {
                    const ctx = getAudioContext();
                    const now = ctx.currentTime;

                    const carrier = ctx.createOscillator();
                    carrier.type = 'sawtooth';
                    carrier.frequency.value = 320;

                    const mod = ctx.createOscillator();
                    mod.type = 'square';
                    mod.frequency.value = 80;

                    const modGain = ctx.createGain();
                    modGain.gain.value = 160;

                    const filter = ctx.createBiquadFilter();
                    filter.type = 'lowpass';
                    filter.frequency.value = 1500;

                    const mainGain = ctx.createGain();

                    mod.connect(modGain);
                    modGain.connect(carrier.frequency);
                    carrier.connect(filter);
                    filter.connect(mainGain);
                    mainGain.connect(ctx.destination);

                    mainGain.gain.setValueAtTime(0, now);
                    mainGain.gain.linearRampToValueAtTime(0.5, now + 0.02);
                    mainGain.gain.setValueAtTime(0.5, now + 0.7);
                    mainGain.gain.exponentialRampToValueAtTime(0.001, now + 1.0);

                    carrier.start(now);
                    mod.start(now);
                    carrier.stop(now + 1.0);
                    mod.stop(now + 1.0);
                }
            },
            {
                name: "ブザー #8 - パンチ",
                desc: "アタック強め、切れの良い音",
                play: () => {
                    const ctx = getAudioContext();
                    const now = ctx.currentTime;

                    const carrier = ctx.createOscillator();
                    carrier.type = 'square';
                    carrier.frequency.value = 380;

                    const mod = ctx.createOscillator();
                    mod.type = 'square';
                    mod.frequency.value = 95;

                    const modGain = ctx.createGain();
                    modGain.gain.value = 130;

                    const distortion = ctx.createWaveShaper();
                    distortion.curve = createDistortionCurve(30);

                    const mainGain = ctx.createGain();

                    mod.connect(modGain);
                    modGain.connect(carrier.frequency);
                    carrier.connect(distortion);
                    distortion.connect(mainGain);
                    mainGain.connect(ctx.destination);

                    mainGain.gain.setValueAtTime(0, now);
                    mainGain.gain.linearRampToValueAtTime(0.5, now + 0.005);
                    mainGain.gain.exponentialRampToValueAtTime(0.001, now + 0.6);

                    carrier.start(now);
                    mod.start(now);
                    carrier.stop(now + 0.6);
                    mod.stop(now + 0.6);
                }
            },
            {
                name: "ブザー #9 - レトロジム",
                desc: "昔のボクシングジム風",
                play: () => {
                    const ctx = getAudioContext();
                    const now = ctx.currentTime;

                    const carrier = ctx.createOscillator();
                    carrier.type = 'sawtooth';
                    carrier.frequency.value = 360;

                    const mod = ctx.createOscillator();
                    mod.type = 'triangle';
                    mod.frequency.value = 90;

                    const modGain = ctx.createGain();
                    modGain.gain.value = 140;

                    const filter = ctx.createBiquadFilter();
                    filter.type = 'bandpass';
                    filter.frequency.value = 800;
                    filter.Q.value = 2;

                    const mainGain = ctx.createGain();

                    mod.connect(modGain);
                    modGain.connect(carrier.frequency);
                    carrier.connect(filter);
                    filter.connect(mainGain);
                    mainGain.connect(ctx.destination);

                    mainGain.gain.setValueAtTime(0, now);
                    mainGain.gain.linearRampToValueAtTime(0.5, now + 0.01);
                    mainGain.gain.exponentialRampToValueAtTime(0.001, now + 0.75);

                    carrier.start(now);
                    mod.start(now);
                    carrier.stop(now + 0.75);
                    mod.stop(now + 0.75);
                }
            },
            {
                name: "ブザー #10 - モダンブザー",
                desc: "クリアで現代的な音",
                play: () => {
                    const ctx = getAudioContext();
                    const now = ctx.currentTime;

                    const carrier = ctx.createOscillator();
                    carrier.type = 'sawtooth';
                    carrier.frequency.value = 400;

                    const mod = ctx.createOscillator();
                    mod.type = 'sine';
                    mod.frequency.value = 100;

                    const modGain = ctx.createGain();
                    modGain.gain.value = 80;

                    const mainGain = ctx.createGain();

                    mod.connect(modGain);
                    modGain.connect(carrier.frequency);
                    carrier.connect(mainGain);
                    mainGain.connect(ctx.destination);

                    mainGain.gain.setValueAtTime(0, now);
                    mainGain.gain.linearRampToValueAtTime(0.45, now + 0.01);
                    mainGain.gain.exponentialRampToValueAtTime(0.001, now + 0.7);

                    carrier.start(now);
                    mod.start(now);
                    carrier.stop(now + 0.7);
                    mod.stop(now + 0.7);
                }
            }
        ];

        // ========================================
        // 拍子木/クラッパー音のバリエーション（10種類）
        // すべて2連打（カンカン）
        // ========================================

        const clapperVariations = [
            {
                name: "拍子木 #1 - クラシック",
                desc: "伝統的な乾いた木の音",
                play: () => playClapper(800, 1200, 0.04, 100)
            },
            {
                name: "拍子木 #2 - ハイピッチ",
                desc: "高めの鋭い音",
                play: () => playClapper(1000, 1500, 0.035, 90)
            },
            {
                name: "拍子木 #3 - ローピッチ",
                desc: "低めの太い音",
                play: () => playClapper(600, 900, 0.05, 110)
            },
            {
                name: "拍子木 #4 - シャープ",
                desc: "非常に短く切れの良い音",
                play: () => playClapper(850, 1100, 0.025, 80)
            },
            {
                name: "拍子木 #5 - ウッディ",
                desc: "木の響きが強い",
                play: () => playClapper(700, 1050, 0.055, 120)
            },
            {
                name: "拍子木 #6 - メタリック",
                desc: "金属的な響き",
                play: () => playClapperMetallic(1200, 1800, 0.04)
            },
            {
                name: "拍子木 #7 - ソフト",
                desc: "柔らかめの音",
                play: () => playClapper(750, 1000, 0.06, 130)
            },
            {
                name: "拍子木 #8 - クリック",
                desc: "カチッとしたクリック音",
                play: () => playClapper(900, 1400, 0.02, 70)
            },
            {
                name: "拍子木 #9 - ダブルアタック",
                desc: "アタックが強い2連打",
                play: () => playClapperStrong(800, 1200)
            },
            {
                name: "拍子木 #10 - ボクシング",
                desc: "本格的なボクシング10秒前",
                play: () => playClapperBoxing()
            }
        ];

        // 基本的な拍子木音（2連打）
        function playClapper(freq1, freq2, duration, interval) {
            const ctx = getAudioContext();

            function singleClap(time) {
                const osc1 = ctx.createOscillator();
                const osc2 = ctx.createOscillator();
                osc1.type = 'sine';
                osc2.type = 'sine';
                osc1.frequency.value = freq1;
                osc2.frequency.value = freq2;

                const noiseBuffer = ctx.createBuffer(1, ctx.sampleRate * duration, ctx.sampleRate);
                const noiseData = noiseBuffer.getChannelData(0);
                for (let i = 0; i < noiseData.length; i++) {
                    noiseData[i] = (Math.random() * 2 - 1) * 0.3;
                }
                const noise = ctx.createBufferSource();
                noise.buffer = noiseBuffer;

                const highpass = ctx.createBiquadFilter();
                highpass.type = 'highpass';
                highpass.frequency.value = 500;

                const gain1 = ctx.createGain();
                const gain2 = ctx.createGain();
                const noiseGain = ctx.createGain();
                const mainGain = ctx.createGain();

                osc1.connect(gain1);
                osc2.connect(gain2);
                noise.connect(noiseGain);
                gain1.connect(highpass);
                gain2.connect(highpass);
                noiseGain.connect(highpass);
                highpass.connect(mainGain);
                mainGain.connect(ctx.destination);

                gain1.gain.setValueAtTime(0.4, time);
                gain1.gain.exponentialRampToValueAtTime(0.001, time + duration);

                gain2.gain.setValueAtTime(0.25, time);
                gain2.gain.exponentialRampToValueAtTime(0.001, time + duration);

                noiseGain.gain.setValueAtTime(0.2, time);
                noiseGain.gain.exponentialRampToValueAtTime(0.001, time + duration * 0.5);

                mainGain.gain.value = 1;

                osc1.frequency.setValueAtTime(freq1, time);
                osc1.frequency.exponentialRampToValueAtTime(freq1 * 0.5, time + duration);

                osc1.start(time);
                osc2.start(time);
                noise.start(time);
                osc1.stop(time + duration);
                osc2.stop(time + duration);
                noise.stop(time + duration);
            }

            const now = ctx.currentTime;
            singleClap(now);
            singleClap(now + interval / 1000);
        }

        // メタリックな拍子木
        function playClapperMetallic(freq1, freq2, duration) {
            const ctx = getAudioContext();

            function singleClap(time) {
                const osc1 = ctx.createOscillator();
                const osc2 = ctx.createOscillator();
                const osc3 = ctx.createOscillator();
                osc1.type = 'sine';
                osc2.type = 'sine';
                osc3.type = 'sine';
                osc1.frequency.value = freq1;
                osc2.frequency.value = freq2;
                osc3.frequency.value = freq1 * 2.5;

                const mainGain = ctx.createGain();
                osc1.connect(mainGain);
                osc2.connect(mainGain);
                osc3.connect(mainGain);
                mainGain.connect(ctx.destination);

                mainGain.gain.setValueAtTime(0.35, time);
                mainGain.gain.exponentialRampToValueAtTime(0.001, time + duration);

                osc1.start(time);
                osc2.start(time);
                osc3.start(time);
                osc1.stop(time + duration);
                osc2.stop(time + duration);
                osc3.stop(time + duration);
            }

            const now = ctx.currentTime;
            singleClap(now);
            singleClap(now + 0.09);
        }

        // 強いアタックの拍子木
        function playClapperStrong(freq1, freq2) {
            const ctx = getAudioContext();

            function singleClap(time) {
                const osc1 = ctx.createOscillator();
                osc1.type = 'sine';
                osc1.frequency.value = freq1;

                const noiseBuffer = ctx.createBuffer(1, ctx.sampleRate * 0.03, ctx.sampleRate);
                const noiseData = noiseBuffer.getChannelData(0);
                for (let i = 0; i < noiseData.length; i++) {
                    noiseData[i] = Math.random() * 2 - 1;
                }
                const noise = ctx.createBufferSource();
                noise.buffer = noiseBuffer;

                const highpass = ctx.createBiquadFilter();
                highpass.type = 'highpass';
                highpass.frequency.value = 400;

                const mainGain = ctx.createGain();
                osc1.connect(mainGain);
                noise.connect(highpass);
                highpass.connect(mainGain);
                mainGain.connect(ctx.destination);

                mainGain.gain.setValueAtTime(0.6, time);
                mainGain.gain.exponentialRampToValueAtTime(0.001, time + 0.04);

                osc1.start(time);
                noise.start(time);
                osc1.stop(time + 0.04);
                noise.stop(time + 0.04);
            }

            const now = ctx.currentTime;
            singleClap(now);
            singleClap(now + 0.08);
        }

        // ボクシング風の拍子木
        function playClapperBoxing() {
            const ctx = getAudioContext();

            function singleClap(time) {
                // 基音
                const osc1 = ctx.createOscillator();
                osc1.type = 'sine';
                osc1.frequency.value = 850;

                // 倍音
                const osc2 = ctx.createOscillator();
                osc2.type = 'sine';
                osc2.frequency.value = 1250;

                // ノイズ（衝撃音）
                const noiseBuffer = ctx.createBuffer(1, ctx.sampleRate * 0.05, ctx.sampleRate);
                const noiseData = noiseBuffer.getChannelData(0);
                for (let i = 0; i < noiseData.length; i++) {
                    noiseData[i] = (Math.random() * 2 - 1) * (1 - i / noiseData.length);
                }
                const noise = ctx.createBufferSource();
                noise.buffer = noiseBuffer;

                const highpass = ctx.createBiquadFilter();
                highpass.type = 'highpass';
                highpass.frequency.value = 600;

                const gain1 = ctx.createGain();
                const gain2 = ctx.createGain();
                const noiseGain = ctx.createGain();
                const mainGain = ctx.createGain();

                osc1.connect(gain1);
                osc2.connect(gain2);
                noise.connect(noiseGain);

                gain1.connect(highpass);
                gain2.connect(highpass);
                noiseGain.connect(highpass);
                highpass.connect(mainGain);
                mainGain.connect(ctx.destination);

                const dur = 0.045;

                gain1.gain.setValueAtTime(0.5, time);
                gain1.gain.exponentialRampToValueAtTime(0.001, time + dur);

                gain2.gain.setValueAtTime(0.3, time);
                gain2.gain.exponentialRampToValueAtTime(0.001, time + dur);

                noiseGain.gain.setValueAtTime(0.25, time);
                noiseGain.gain.exponentialRampToValueAtTime(0.001, time + dur * 0.4);

                mainGain.gain.value = 1;

                // ピッチダウン
                osc1.frequency.setValueAtTime(850, time);
                osc1.frequency.exponentialRampToValueAtTime(450, time + dur);

                osc1.start(time);
                osc2.start(time);
                noise.start(time);
                osc1.stop(time + dur);
                osc2.stop(time + dur);
                noise.stop(time + dur);
            }

            const now = ctx.currentTime;
            singleClap(now);
            singleClap(now + 0.1);
        }

        // ボタン生成
        function createButtons() {
            const buzzerContainer = document.getElementById('buzzer-sounds');
            const clapperContainer = document.getElementById('clapper-sounds');

            buzzerVariations.forEach((v, i) => {
                const btn = document.createElement('button');
                btn.className = 'sound-btn';
                btn.innerHTML = `<div class="title">${v.name}</div><div class="desc">${v.desc}</div>`;
                btn.onclick = v.play;
                buzzerContainer.appendChild(btn);
            });

            clapperVariations.forEach((v, i) => {
                const btn = document.createElement('button');
                btn.className = 'sound-btn';
                btn.innerHTML = `<div class="title">${v.name}</div><div class="desc">${v.desc}</div>`;
                btn.onclick = v.play;
                clapperContainer.appendChild(btn);
            });
        }

        createButtons();
    </script>
</body>

</html>
