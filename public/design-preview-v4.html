<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Heavy Timer - Sound Preview v4</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@700&display=swap" rel="stylesheet">

    <style>
        :root {
            --timer-green: #00ff00;
            --bg-color: #0a0a0a;
        }

        body {
            background-color: var(--bg-color);
            color: white;
            font-family: 'Segoe UI', sans-serif;
            padding: 20px;
            max-width: 1000px;
            margin: 0 auto;
        }

        h1,
        h2 {
            border-bottom: 1px solid #333;
            padding-bottom: 10px;
            color: var(--timer-green);
        }

        .section {
            margin-bottom: 50px;
        }

        .sound-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 15px;
        }

        .sound-btn {
            background: #222;
            border: 1px solid #444;
            color: #fff;
            padding: 15px;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.1s;
            text-align: left;
        }

        .sound-btn:hover {
            background: #333;
            border-color: var(--timer-green);
        }

        .sound-btn:active {
            transform: scale(0.98);
            background: #444;
        }

        .btn-title {
            font-weight: bold;
            font-size: 16px;
            margin-bottom: 5px;
            color: #fff;
        }

        .btn-desc {
            font-size: 12px;
            color: #aaa;
            line-height: 1.4;
        }

        .highlight {
            border-color: #ffcc00;
            background: #2a2a20;
        }
    </style>
</head>

<body>
    <h1>Sound Preview v4 (Spectrogram Analysis)</h1>

    <div class="section">
        <h2>1. Molten Buzzer (スペクトル分析版)</h2>
        <p>画像データに基づく再現。基音400-600Hz、密な非整数次倍音、広帯域ノイズ。</p>
        <div class="sound-grid" id="molten-grid"></div>
    </div>

    <div class="section">
        <h2>2. 終了音 (低音ピリピリ・粒立ち強化)</h2>
        <p>低音(800-1000Hz)、スタッカート強調。</p>
        <div class="sound-grid" id="piri-grid"></div>
    </div>

    <div class="section">
        <h2>3. 10秒前警告 (完全ドライ・クラック)</h2>
        <p>こもり排除(HPF強化)、硬い木の衝突音。</p>
        <div class="sound-grid" id="clack-grid"></div>
    </div>

    <script>
        const ctx = new (window.AudioContext || window.webkitAudioContext)();

        // ==========================================
        // 1. Molten Buzzer (スペクトル分析版)
        // ==========================================
        function playSpectrogramBuzzer(params) {
            const now = ctx.currentTime;
            const {
                baseFreq,      // 基音 (400-600Hz)
                modFreq,       // 変調周波数 (非整数比用)
                modIndex,      // 変調指数 (大きくして倍音を増やす)
                noiseMix = 0.1,// ノイズ成分量
                duration = 0.8 // 音長
            } = params;

            // --- Layer 1: Core FM (濁った基音と密な倍音) ---
            const carrier = ctx.createOscillator();
            const modulator = ctx.createOscillator();
            const modGain = ctx.createGain();

            carrier.type = 'sawtooth'; // 鋸歯状波でリッチに
            carrier.frequency.value = baseFreq;

            modulator.type = 'square'; // 矩形波変調でエッジを出す
            modulator.frequency.value = modFreq;

            modGain.gain.value = modIndex; // 強力な変調

            modulator.connect(modGain);
            modGain.connect(carrier.frequency);

            // --- Layer 2: Sub Layer (厚みを足す) ---
            const subOsc = ctx.createOscillator();
            subOsc.type = 'triangle';
            subOsc.frequency.value = baseFreq * 0.5; // 1オクターブ下

            // --- Layer 3: Noise (広帯域成分) ---
            const noiseSize = ctx.sampleRate * duration;
            const noiseBuf = ctx.createBuffer(1, noiseSize, ctx.sampleRate);
            const output = noiseBuf.getChannelData(0);
            for (let i = 0; i < noiseSize; i++) {
                output[i] = (Math.random() * 2 - 1);
            }
            const noiseNode = ctx.createBufferSource();
            noiseNode.buffer = noiseBuf;
            const noiseFilter = ctx.createBiquadFilter();
            noiseFilter.type = 'lowpass'; // 高域を少し削る
            noiseFilter.frequency.value = 8000;

            // --- Mixing ---
            const masterGain = ctx.createGain();
            const subGain = ctx.createGain();
            const noiseGain = ctx.createGain();

            carrier.connect(masterGain);
            subOsc.connect(subGain); subGain.connect(masterGain);
            noiseNode.connect(noiseFilter); noiseFilter.connect(noiseGain); noiseGain.connect(masterGain);

            masterGain.connect(ctx.destination);

            // --- Envelopes ---
            // Main: アタック強め、デッドな減衰
            masterGain.gain.setValueAtTime(0, now);
            masterGain.gain.linearRampToValueAtTime(0.5, now + 0.01);
            masterGain.gain.exponentialRampToValueAtTime(0.001, now + duration);

            // Sub: 控えめに
            subGain.gain.value = 0.2;

            // Noise: 最初のアタック時に強く、すぐ消える
            noiseGain.gain.setValueAtTime(noiseMix, now);
            noiseGain.gain.exponentialRampToValueAtTime(0.001, now + 0.3);

            carrier.start(now);
            modulator.start(now);
            subOsc.start(now);
            noiseNode.start(now);

            carrier.stop(now + duration + 0.1);
            modulator.stop(now + duration + 0.1);
            subOsc.stop(now + duration + 0.1);
            noiseNode.stop(now + duration + 0.1);
        }

        const moltenVariations = [
            {
                name: "Spec #1: Dense Core",
                desc: "基音450Hz, Mod 635Hz(1:1.41), Index 800. 密な倍音。",
                p: { baseFreq: 450, modFreq: 635, modIndex: 800, noiseMix: 0.1 }
            },
            {
                name: "Spec #2: Lower Base",
                desc: "基音400Hz, Mod 560Hz(1:1.4), Index 1200. 重厚。",
                p: { baseFreq: 400, modFreq: 560, modIndex: 1200, noiseMix: 0.15 }
            },
            {
                name: "Spec #3: High Harmonics",
                desc: "基音550Hz, Mod 137.5Hz(4:1), Index 2000. 鋭いピーク。",
                p: { baseFreq: 550, modFreq: 137.5, modIndex: 2000, noiseMix: 0.1 }
            },
            {
                name: "Spec #4: Dirty Metal",
                desc: "基音480Hz, Mod 333Hz, Index 1500. 非整数比強調。",
                p: { baseFreq: 480, modFreq: 333, modIndex: 1500, noiseMix: 0.2 }
            },
            {
                name: "Spec #5: Impact Heavy",
                desc: "基音500Hz, ノイズ成分多め。アタック重視。",
                p: { baseFreq: 500, modFreq: 707, modIndex: 1000, noiseMix: 0.4 }
            },
            {
                name: "Spec #6: The Buzz",
                desc: "基音420Hz, Mod 60Hz. 低周波FMでビビリ音を作る。",
                p: { baseFreq: 420, modFreq: 60, modIndex: 800, noiseMix: 0.1 }
            },
            {
                name: "Spec #7: Sharp Peak",
                desc: "基音600Hz, Mod 900Hz(1:1.5). 完全5度の響き。",
                p: { baseFreq: 600, modFreq: 900, modIndex: 1200, noiseMix: 0.1 }
            },
            {
                name: "Spec #8: Chaos",
                desc: "基音440Hz, Mod 314Hz(π). 複雑な倍音。",
                p: { baseFreq: 440, modFreq: 314, modIndex: 1800, noiseMix: 0.2 }
            },
            {
                name: "Spec #9: Fat Body",
                desc: "基音380Hz, Mod 190Hz. オクターブ下変調。",
                p: { baseFreq: 380, modFreq: 190, modIndex: 1500, noiseMix: 0.15 }
            },
            {
                name: "Spec #10: Clear Attack",
                desc: "基音520Hz, Mod 728Hz. 立ち上がり重視。",
                p: { baseFreq: 520, modFreq: 728, modIndex: 900, noiseMix: 0.1 }
            },
        ];

        // ==========================================
        // 2. 終了音 (低音ピリピリ・粒立ち強化)
        // ==========================================
        function playRefinedPiri(params) {
            const now = ctx.currentTime;
            const { freq, speed, count, duty } = params;
            const interval = 1 / speed;
            const duration = interval * duty;

            for (let i = 0; i < count; i++) {
                const t = now + i * interval;
                const osc = ctx.createOscillator();
                osc.type = 'sawtooth';
                osc.frequency.value = freq;

                // フィルターで角を取るor強調する
                const filter = ctx.createBiquadFilter();
                filter.type = 'lowpass';
                filter.frequency.value = freq * 3; // 倍音を少し残す

                const gain = ctx.createGain();
                osc.connect(filter);
                filter.connect(gain);
                gain.connect(ctx.destination);

                // 粒立ち重視のエンベロープ
                gain.gain.setValueAtTime(0, t);
                gain.gain.linearRampToValueAtTime(0.7, t + 0.003); // アタック超高速
                gain.gain.setValueAtTime(0.7, t + duration * 0.8);
                gain.gain.exponentialRampToValueAtTime(0.001, t + duration); // スパッと切る

                osc.start(t);
                osc.stop(t + duration + 0.05);
            }
        }

        const piriVariations = [
            { name: "Piri V4 #1", desc: "900Hz, 15回/秒, Duty 20%", p: { freq: 900, speed: 15, count: 15, duty: 0.2 } },
            { name: "Piri V4 #2", desc: "800Hz, 12回/秒, Duty 25%", p: { freq: 800, speed: 12, count: 12, duty: 0.25 } },
            { name: "Piri V4 #3", desc: "1000Hz, 18回/秒, Duty 15% (鋭い)", p: { freq: 1000, speed: 18, count: 18, duty: 0.15 } },
            { name: "Piri V4 #4", desc: "700Hz, 10回/秒, Duty 30% (重い)", p: { freq: 700, speed: 10, count: 10, duty: 0.3 } },
            { name: "Piri V4 #5", desc: "1100Hz, 20回/秒, Duty 10% (極細)", p: { freq: 1100, speed: 20, count: 20, duty: 0.1 } },
        ];

        // ==========================================
        // 3. 10秒前警告 (完全ドライ・クラック)
        // ==========================================
        function playRefinedClack(params) {
            const now = ctx.currentTime;
            const { hpFreq, interval = 0.2 } = params;

            [now, now + interval].forEach(t => {
                // 完全ドライ：ノイズバーストのみ
                const buf = ctx.createBuffer(1, ctx.sampleRate * 0.05, ctx.sampleRate);
                const data = buf.getChannelData(0);
                for (let i = 0; i < data.length; i++) data[i] = Math.random() * 2 - 1;

                const src = ctx.createBufferSource();
                src.buffer = buf;

                const filter = ctx.createBiquadFilter();
                filter.type = 'highpass';
                filter.frequency.value = hpFreq; // こもりを除去するHPF周波数

                const gain = ctx.createGain();
                src.connect(filter);
                filter.connect(gain);
                gain.connect(ctx.destination);

                // 衝撃音エンベロープ
                gain.gain.setValueAtTime(0.9, t);
                gain.gain.exponentialRampToValueAtTime(0.001, t + 0.015); // パツッ！と切る

                src.start(t);
                src.stop(t + 0.05);
            });
        }

        const clackVariations = [
            { name: "Clack V4 #1", desc: "HPF 1500Hz (標準)", p: { hpFreq: 1500 } },
            { name: "Clack V4 #2", desc: "HPF 2500Hz (より乾いた音)", p: { hpFreq: 2500 } },
            { name: "Clack V4 #3", desc: "HPF 3500Hz (クリッキー)", p: { hpFreq: 3500 } },
            { name: "Clack V4 #4", desc: "HPF 1000Hz (少し厚みあり)", p: { hpFreq: 1000 } },
            { name: "Clack V4 #5", desc: "HPF 5000Hz (極短・硬質)", p: { hpFreq: 5000 } },
        ];


        // UI生成
        const moltenGrid = document.getElementById('molten-grid');
        moltenVariations.forEach(v => {
            const btn = document.createElement('button');
            btn.className = 'sound-btn';
            if (v.name.includes("Spec")) btn.classList.add('highlight'); // スペクトル版を強調
            btn.innerHTML = `<div class="btn-title">${v.name}</div><div class="btn-desc">${v.desc}</div>`;
            btn.onclick = () => playSpectrogramBuzzer(v.p);
            moltenGrid.appendChild(btn);
        });

        const piriGrid = document.getElementById('piri-grid');
        piriVariations.forEach(v => {
            const btn = document.createElement('button');
            btn.className = 'sound-btn';
            btn.innerHTML = `<div class="btn-title">${v.name}</div><div class="btn-desc">${v.desc}</div>`;
            btn.onclick = () => playRefinedPiri(v.p);
            piriGrid.appendChild(btn);
        });

        const clackGrid = document.getElementById('clack-grid');
        clackVariations.forEach(v => {
            const btn = document.createElement('button');
            btn.className = 'sound-btn';
            btn.innerHTML = `<div class="btn-title">${v.name}</div><div class="btn-desc">${v.desc}</div>`;
            btn.onclick = () => playRefinedClack(v.p);
            clackGrid.appendChild(btn);
        });

    </script>
</body>

</html>
